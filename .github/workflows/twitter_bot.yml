name: Apex Swarm Twitter Bot

on:
  # DISABLED: Apex Swarm / swarmsfall.com is shut down. The scheduled triggers
  # were removed so this can never post again. Manual dispatch stays available
  # but the job itself is also gated off below.
  workflow_dispatch:

jobs:
  post-tweet:
    if: false  # company shut down; never run
    runs-on: ubuntu-latest
    steps:
      - name: Trigger tweet via Railway app
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            https://swarmsfall.com/api/v1/twitter/autopost \
            -H "X-Api-Key: ${{ secrets.ADMIN_API_KEY }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed with HTTP $HTTP_CODE"
            exit 1
          fi
